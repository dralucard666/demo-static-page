media:
  input: src/images
  output: /demo-static-page/images

content:
  - name: home
    label: Startseite
    type: file
    path: src/index.md
    fields:
      - { name: title, label: "Seitentitel (Browser-Tab)", type: string }
      - { name: brand, label: Firmenname, type: string }
      - { name: tagline, label: Slogan, type: string }
      - { name: subtitle, label: Untertitel, type: string }
      - { name: intro, label: Einleitungstext, type: rich-text }
      - name: service_categories
        label: Leistungskategorien
        type: object
        list: true
        fields:
          - { name: icon, label: "Icon (Emoji)", type: string }
          - { name: category_title, label: Titel, type: string }
          - name: items
            label: Punkte
            type: string
            list: true
      - name: billing_box
        label: Infobox Pflegekasse
        type: object
        fields:
          - { name: box_title, label: Titel, type: string }
          - { name: body, label: Text, type: rich-text }
          - { name: note, label: Rechtlicher Hinweis, type: string }
      - name: contact
        label: Kontakt
        type: object
        fields:
          - { name: owner, label: Inhaber, type: string }
          - { name: hours, label: Erreichbarkeit, type: string }
          - { name: phone, label: Telefon, type: string }
          - { name: email, label: E-Mail, type: string }
          - { name: address_line1, label: "Straße & Hausnummer", type: string }
          - { name: address_line2, label: "PLZ & Ort", type: string }
          - { name: service_area, label: Einsatzgebiet, type: string }
